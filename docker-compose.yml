services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-salesbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salesbot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: always

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-salesbot}
      TZ: Asia/Tashkent
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesbot} -d ${POSTGRES_DB:-salesbot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]  # FSM drafts survive Redis restarts too
    volumes: [redisdata:/data]
    restart: always

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: always

volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  caddy_config: {}
