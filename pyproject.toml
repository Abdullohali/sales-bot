[project]
name = "sales-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "babel>=2.16",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "redis>=5",
    "sentry-sdk[fastapi]>=2.14",
    "sqladmin>=0.20",
    "sqlalchemy[asyncio]>=2.0.35",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal objects natively:sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/i18n/*.py" = ["E501"]  # translation catalogs: one message per line
