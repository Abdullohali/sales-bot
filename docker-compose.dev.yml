# Local development: only Postgres + Redis in Docker, the app runs on the host:
#   docker compose -f docker-compose.dev.yml up -d
#   uv run alembic upgrade head && uv run uvicorn app.main:app --reload
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: salesbot
      POSTGRES_PASSWORD: salesbot
      POSTGRES_DB: salesbot
    ports: ["5432:5432"]
    volumes: [pgdata_dev:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata_dev: {}
